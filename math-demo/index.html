    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return [];

      const result = [];
      for (let i = 0; i < lines.length; i++) {
        const row = [];
        let inQuotes = false;
        let currentValue = '';
        const line = lines[i];

        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"' || char === "'") {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(currentValue.trim());
            currentValue = '';
          } else {
            currentValue += char;
          }
        }
        row.push(currentValue.trim());
        result.push(row);
      }
      return result;
    }

    function isUrl(str) {
      if (!str) return false;
      return /^https?:\/\/[^\s]+/i.test(str.trim());
    }

    function parseUnitIndex(text) {
      if (!text) return -1;
      const str = text.trim();
      const cnMap = { "一": 0, "二": 1, "三": 2, "四": 3, "五": 4, "六": 5, "七": 6, "八": 7, "九": 8, "十": 9 };

      const numMatch = str.match(/第?\s*([1-9]|10)\s*單元?/i);
      if (numMatch) {
        return parseInt(numMatch[1], 10) - 1;
      }

      const cnMatch = str.match(/第?\s*([一二三四五六七八九十])\s*單元?/);
      if (cnMatch && cnMap[cnMatch[1]] !== undefined) {
        return cnMap[cnMatch[1]];
      }

      for (let i = 0; i < UNIT_KEYWORDS.length; i++) {
        for (const k of UNIT_KEYWORDS[i].keys) {
          if (str.includes(k)) {
            return i;
          }
        }
      }
      return -1;
    }

            let detectedIndex = -1;

            for (let c = 0; c < row.length; c++) {
              const cell = (row[c] || '').trim();
              if (!cell) continue;

              if (isUrl(cell)) {
                foundUrl = cell;
              } else {
                const parsedIdx = parseUnitIndex(cell);
                if (parsedIdx !== -1 && detectedIndex === -1) {
                  detectedIndex = parsedIdx;
                }
              }
            }

            let targetIdx = detectedIndex !== -1 ? detectedIndex : (i - 1);

            if (targetIdx >= 0 && targetIdx < updated.length) {
              if (foundUrl && isUrl(foundUrl)) {
                const wasUpcoming = updated[targetIdx].status !== 'active';
                updated[targetIdx].url = foundUrl;
                updated[targetIdx].status = 'active';
                if (wasUpcoming && targetIdx >= 4) {
                  unlockedCount++;
                }
              }
            }
          }

          currentUnits = updated;
          renderUnitGrid();

          if (isManual) {
            showToast("已同步試算表最新單元！✨");
          } else if (unlockedCount > 0) {
            showToast(`已自動解鎖 ${unlockedCount} 個新完成單元！🎉`);
          }
        }
      } catch (err) {
        console.warn("試算表讀取提示：維持現況", err);
        if (isManual) showToast("已重整單元列表！✨");
      } finally {
        if (icon) icon.classList.remove('fa-spin');
      }
    }

    function openNoticeModal(title, htmlDesc) {
      document.getElementById('noticeTitle').innerText = title;
      if (htmlDesc) {
        document.getElementById('noticeDesc').innerHTML = htmlDesc;
      }
      document.getElementById('noticeModal').classList.remove('hidden');
    }

    function closeNoticeModal() {
      document.getElementById('noticeModal').classList.add('hidden');
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeNoticeModal();
    });

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
      }, 2300);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 初始化與背景監聽
    window.onload = function () {
      renderUnitGrid();
      syncFromGoogleSheet(false);

      // 分頁切換回視窗時自動重新檢查
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          syncFromGoogleSheet(false);
        }
      });

      // 每 30 秒自動向試算表輪詢同步一次
      setInterval(() => {
        syncFromGoogleSheet(false);
      }, 30000);
    };
  </script>
</body>
